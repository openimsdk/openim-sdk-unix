plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
}

android {
    namespace '__OPENIM_ANDROID_APP_ID__'
    compileSdk 36

    defaultConfig {
        applicationId '__OPENIM_ANDROID_APP_ID__'
        minSdk 21
        targetSdk 32
        versionCode 1
        versionName '0.1.0-local'

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }

        buildConfigField 'String', 'DCLOUDUnionId', '""'
        buildConfigField 'String', 'UTSRegisterComponents', '"[]"'
        buildConfigField 'String', 'UTSRegisterProviders', '"[]"'
        buildConfigField 'String[]', 'UTSHooksClassArray', '{}'
        buildConfigField 'String', 'UTSEasyCom', '"[]"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    packaging {
        resources {
            excludes += [
                    '/META-INF/{AL2.0,LGPL2.1}',
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE*',
                    'META-INF/NOTICE*'
            ]
        }
        jniLibs {
            pickFirsts += ['**/libc++_shared.so']
        }
    }

    aaptOptions {
        additionalParameters '--auto-add-overlay'
        ignoreAssetsPattern '!.svn:!.git:.*:!CVS:!thumbs.db:!picasa.ini:!*.scc:*~'
    }
}

dependencies {
    implementation project(':uniappx')
    implementation project(':unix-openim-sdk')

    implementation fileTree(dir: '../dcloud-libs', include: ['*.aar', '*.jar'])
    implementation fileTree(dir: '../unix-openim-sdk/libs', include: ['*.aar', '*.jar'])

    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.fragment:fragment:1.7.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.6'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.6.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.tracing:tracing:1.2.0'
    implementation 'androidx.window:window-java:1.2.0'
    implementation 'androidx.lifecycle:lifecycle-common:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.alibaba:fastjson:1.2.83'
    implementation 'com.facebook.fresco:fresco:3.4.0'
    implementation 'com.facebook.fresco:middleware:3.4.0'
    implementation 'com.facebook.fresco:animated-gif:3.4.0'
    implementation 'com.facebook.fresco:webpsupport:3.4.0'
    implementation 'com.facebook.fresco:animated-webp:3.4.0'
    implementation 'com.caverock:androidsvg:1.4'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.20'
    implementation 'org.jetbrains.kotlin:kotlin-reflect:2.2.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.4.1'
    implementation 'net.lingala.zip4j:zip4j:2.11.5'
    implementation 'com.squareup.okhttp3:okhttp:3.12.12'
    implementation 'com.github.getActivity:XXPermissions:18.63'
    implementation 'com.getkeepsafe.relinker:relinker:1.4.5'
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'
}
